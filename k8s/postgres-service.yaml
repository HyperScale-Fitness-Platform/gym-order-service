apiVersion: v1
kind: Service
metadata:
  name: gym-order-postgres
  namespace: gym-dev
  labels: { app: gym-order-postgres, component: database, service: gym-order-postgres }
spec:
  type: ClusterIP
  ports:
    - port: 15432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector: { app: gym-order-postgres, component: database }
